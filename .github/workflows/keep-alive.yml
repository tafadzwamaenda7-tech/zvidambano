# Keeps the Supabase project awake.
#
# Free-tier Supabase projects pause after 7 days without activity. This runs a
# tiny read query every day so the project stays live. GitHub Actions is free
# and runs in the cloud, so no machine needs to stay on.
#
# First-time setup (one minute):
#   1. GitHub -> repo -> Settings -> Secrets and variables -> Actions
#   2. Add repository secrets:
#        SUPABASE_URL        = https://xbokkkwzvoxujmarmwta.supabase.co
#        SUPABASE_ANON_KEY   = your anon key (from .env: VITE_SUPABASE_ANON_KEY)
#      (Optional: SUPABASE_SERVICE_KEY to bypass RLS.)
#   3. Done. The workflow runs every day at 06:00 UTC.
#      You can also trigger it manually: Actions -> "Keep Supabase Active" -> Run workflow.

name: Keep Supabase Active

on:
  schedule:
    # Daily at 06:00 UTC (06:00 GMT). Supabase pauses after 7 idle days, so
    # daily is comfortably above the threshold.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping Supabase database
        run: node scripts/keep-alive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
